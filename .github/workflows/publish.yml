name: Publier

# À chaque push sur main : construit les deux extensions signées (.crx),
# génère updates.xml et publie le tout sur GitHub Pages.
# Helium vérifie updates.xml tout seul et installe la nouvelle version.
on:
  push:
    branches: [main]
    paths-ignore: ["README*.md", "docs/**"]   # pas de nouvelle version pour un README
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography
      - name: Clés de signature
        env:
          THEME_KEY: ${{ secrets.THEME_KEY }}
          PAGES_KEY: ${{ secrets.PAGES_KEY }}
        run: |
          mkdir -p keys
          printf '%s\n' "$THEME_KEY" > keys/theme.pem
          printf '%s\n' "$PAGES_KEY" > keys/pages.pem
      # La version augmente à chaque publication : 1.0.<numéro du run>
      - run: python scripts/build.py "1.0.${{ github.run_number }}" "https://glime32.github.io/helium-theme-oled-violet"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
